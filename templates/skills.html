<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='skills.css') }}">

    <title>Skills | Roommates</title>
</head>

<body>

    <header>
        <h1>{{ name }}'s Skills</h1>
        <p>Technologies & tools I work with</p>
    </header>

    <main class="skills-container">

        {% for category, skill_list in skills.items() %}

            <section class="skill-category">

                <h2>{{ category }}</h2>

                <div class="skills-grid">

                    {% for skill in skill_list %}

                        <div class="skill-card">

                            <h3>
                                <img src="{{ skill.icon }}" height="40px" width="37px">
                                {{ skill.name }}
                            </h3>

                            <p class="skill-description">
                                {{ skill.description }}
                            </p>

                        </div>

                    {% endfor %}

                </div>

            </section>

        {% endfor %}

    </main>

</body>
</html>
