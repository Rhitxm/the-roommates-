<!DOCTYPE html>
<html>
<head>
    <div>
    <title >{{ person.name }}'s Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='project.css') }}">
</head>

<body>
    <div class="title">
    <h1 >{{ person.name }}'s Projects</h1>
    </div>
    <div class="project-container"> <!-- we create division like this so we can change those specifically in css-->
        {% for project in projects %}

            <div class="project-card">

            <h2>{{ project.name }}</h2>

            <p>{{ project.description }}</p>

            <p>Language: {{ project.language }}</p>
            <div class = "project-stars">    
                <p>⭐ {{ project.stars }}</p>
            </div>

            <a href="{{ project.url }}" target="_blank">
                <svg viewBox="0 0 24 24" aria-hidden="true"> <!--svg- scalable vector graphics , they stay sharp when u change size -->
                    <!-- svgs are similar to jpg but they are for html-->
                    <!-- aria-hidden - basically it ignores the graphic and doesn't read it when u use narrator-->
                    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.03 1.75 2.7 1.24 3.36.95.1-.74.4-1.24.73-1.52-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.08.78 2.18v3.23c0 .31.21.67.8.56A10.99 10.99 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                    <!--this d= ... are the instructions to draw the desired logo-->
                </svg>
                
            </a>

            </div>

        {% endfor %}
    </div>
<div class="contribution-chart">
    <h2>GitHub Contributions</h2>

    <img src="https://ghchart.rshah.org/{{ person.github_username }}"
         alt="{{ person.name }}'s GitHub contribution chart">
</div>
</body>
</html>
